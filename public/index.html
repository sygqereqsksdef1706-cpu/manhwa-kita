<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANHWA-KITA - Premium Manhwa Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070a13;
            --bg-surface: #111727;
            --bg-hover: #1a233a;
            --border-subtle: #232e47;
            --brand-primary: #3b82f6;
            --brand-glow: #60a5fa;
            --brand-accent: #06b6d4;
            --text-high: #f8fafc;
            --text-med: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        
        * { box-sizing: border-box; }
        body { background-color: var(--bg-deep); color: var(--text-high); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        
        /* HEADER & NAVIGATION */
        header { background: rgba(7, 10, 19, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 16px; }
        .logo-container { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 22px; font-weight: 800; color: var(--brand-primary); cursor: pointer; display: flex; align-items: center; gap: 6px; letter-spacing: -0.5px; text-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .logo span { color: var(--text-high); text-shadow: none; }
        
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--text-med); font-size: 14px; font-weight: 600; cursor: pointer; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
        .nav-links a:hover, .nav-links a.active { color: var(--brand-glow); }

        /* SEARCH */
        .search-form { display: flex; gap: 8px; align-items: center; background: var(--bg-surface); padding: 4px 4px 4px 16px; border-radius: 100px; border: 1px solid var(--border-subtle); transition: border-color 0.3s; }
        .search-form:focus-within { border-color: var(--brand-primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        input[type="text"] { background: transparent; border: none; color: var(--text-high); font-size: 14px; outline: none; width: 220px; font-family: inherit; }
        input[type="text"]::placeholder { color: var(--text-med); }
        .search-btn { background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent)); color: #fff; border: none; padding: 8px 18px; border-radius: 100px; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        .search-btn:hover { opacity: 0.9; }

        .container { max-width: 1280px; margin: 0 auto; padding: 30px 5%; }
        .section-title { font-size: 20px; font-weight: 800; margin: 0 0 20px 0; display: flex; align-items: center; gap: 8px; }

        /* CAROUSEL (POPULAR) */
        .carousel-wrapper { margin-bottom: 40px; }
        .carousel { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .carousel::-webkit-scrollbar { height: 8px; }
        .carousel::-webkit-scrollbar-track { background: var(--bg-surface); border-radius: 10px; }
        .carousel::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }
        .carousel::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }
        .carousel .card { flex: 0 0 160px; scroll-snap-align: start; }

        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        
        /* CARD COMPONENT */
        .card { background: var(--bg-surface); border-radius: var(--radius-md); overflow: hidden; cursor: pointer; border: 1px solid var(--border-subtle); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; position: relative; }
        .card:hover { transform: translateY(-6px); border-color: var(--brand-primary); box-shadow: 0 12px 24px -10px rgba(59, 130, 246, 0.3); }
        .card-img { width: 100%; height: 240px; object-fit: cover; background: #000; border-bottom: 1px solid var(--border-subtle); }
        .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .card-title { font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--text-high); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .history-badge { margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--brand-glow); background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 6px; display: inline-block; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 40px; }
        .page-btn { background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-high); padding: 10px 20px; border-radius: 100px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .page-btn:hover:not(:disabled) { background: var(--brand-primary); border-color: var(--brand-primary); }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* VIEWS */
        #history-view, #detail-view, #reader-view { display: none; }
        
        .back-btn { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-med); padding: 8px 16px; border-radius: 100px; margin-bottom: 24px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;}
        .back-btn:hover { background: var(--bg-surface); color: var(--text-high); border-color: var(--text-med); }
        
        /* DETAIL VIEW */
        .detail-flex { display: flex; gap: 30px; align-items: flex-start; background: linear-gradient(145deg, var(--bg-surface) 0%, var(--bg-deep) 100%); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); position: relative; overflow: hidden;}
        .detail-flex::before { content: ''; position: absolute; top: 0; right: 0; width: 300px; height: 300px; background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%); pointer-events: none; }
        
        .detail-cover { width: 200px; height: 280px; object-fit: cover; border-radius: var(--radius-md); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1; flex-shrink: 0; }
        .detail-info { flex: 1; min-width: 0; z-index: 1; display: flex; flex-direction: column;}
        .detail-info h1 { margin: 0 0 12px 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.3; }
        .status-badge { display: inline-block; background: rgba(59, 130, 246, 0.15); color: var(--brand-glow); padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; margin-bottom: 16px; border: 1px solid rgba(59, 130, 246, 0.3); align-self: flex-start; }
        
        .resume-btn { background: linear-gradient(135deg, var(--success), #059669); color: white; border: none; padding: 12px 24px; border-radius: 100px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; display: none; align-items: center; gap: 8px; margin-bottom: 16px; align-self: flex-start; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .resume-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        .synopsis { font-size: 14px; color: var(--text-med); line-height: 1.7; max-height: 140px; overflow-y: auto; padding-right: 10px; }
        .synopsis::-webkit-scrollbar { width: 4px; }
        .synopsis::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

        /* CHAPTER LIST */
        .chapter-box { margin-top: 40px; }
        .chapter-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; max-height: 500px; overflow-y: auto; padding-right: 8px; }
        .chapter-list::-webkit-scrollbar { width: 6px; }
        .chapter-list::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }
        
        .chapter-item { background: var(--bg-surface); border: 1px solid var(--border-subtle); padding: 14px 18px; border-radius: var(--radius-md); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .chapter-item:hover { background: var(--bg-hover); border-color: var(--brand-primary); transform: translateX(4px); }
        .chapter-item.last-read { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }
        .chapter-item.last-read::before { content: '📍'; margin-right: 8px; }
        
        .ch-title { font-size: 14px; font-weight: 600; color: var(--text-high); }
        .ch-date { font-size: 12px; color: var(--text-med); }

        /* READER VIEW & CHAPTER NAVIGATION */
        .reader-container { display: flex; flex-direction: column; align-items: center; background: #000; padding: 0; border-radius: var(--radius-lg); overflow: hidden; min-height: 80vh; }
        .reader-container img { max-width: 100%; width: 720px; height: auto; display: block; margin: 0; }
        
        .reader-header { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; background: var(--bg-surface); padding: 16px 24px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
        .reader-title-bar { display: flex; justify-content: space-between; align-items: center; }
        
        .chapter-nav-buttons { display: flex; gap: 12px; width: 100%; justify-content: space-between; }
        .nav-ch-btn { background: var(--bg-deep); border: 1px solid var(--border-subtle); color: var(--text-high); padding: 12px 20px; border-radius: 100px; font-weight: 600; cursor: pointer; transition: all 0.2s; flex: 1; text-align: center; }
        .nav-ch-btn:hover:not(:disabled) { background: var(--brand-primary); border-color: var(--brand-primary); }
        .nav-ch-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .loading-state, .error-state, .empty-state { text-align: center; padding: 60px 20px; color: var(--text-med); font-weight: 600; grid-column: 1 / -1; width: 100%; }
        .error-state { color: var(--danger); background: rgba(239, 68, 68, 0.1); border-radius: var(--radius-md); border: 1px dashed var(--danger); }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--brand-primary); animation: spin 1s ease-in-out infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .logo-container { flex-direction: column; align-items: flex-start; gap: 10px; width: 100%; }
            .nav-links { width: 100%; justify-content: flex-start; border-top: 1px solid var(--border-subtle); padding-top: 10px; }
            .search-form { width: 100%; }
            input[type="text"] { flex: 1; }
            
            .detail-flex { flex-direction: column; align-items: center; text-align: center; padding: 20px; }
            .detail-cover { width: 150px; height: 210px; margin-bottom: 15px; }
            .status-badge, .resume-btn { align-self: center !important; }
            .chapter-nav-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo" onclick="loadHome();">⚡ MANHWA<span>-KITA</span></div>
            <nav class="nav-links">
                <a id="nav-home" onclick="loadHome()" class="active">🏠 Beranda</a>
                <a id="nav-history" onclick="loadHistoryView()">🕒 Riwayat Baca</a>
            </nav>
        </div>
        <div class="search-form">
            <input type="text" id="searchInput" placeholder="Cari manhwa..." onkeypress="if(event.key==='Enter') handleSearch()">
            <button class="search-btn" onclick="handleSearch()">Cari</button>
        </div>
    </header>

    <div class="container">
        <!-- HOME VIEW -->
        <div id="home-view">
            <!-- Carousel Populer -->
            <div id="popularSection" class="carousel-wrapper">
                <h2 class="section-title">🔥 Manhwa Terpopuler</h2>
                <div id="popularCarousel" class="carousel">
                    <div class="loading-state"><div class="spinner"></div><br>Memuat manhwa populer...</div>
                </div>
            </div>

            <!-- Grid Utama -->
            <div>
                <h2 class="section-title" id="mainSectionTitle">🆕 Update Terbaru</h2>
                <div id="mainGrid" class="grid">
                    <div class="loading-state"><div class="spinner"></div><br>Memuat data...</div>
                </div>
                <div class="pagination" id="paginationBox" style="display: none;">
                    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">← Sebelumnya</button>
                    <span id="pageIndicator" style="font-size: 14px; font-weight: 700; color: var(--text-med);">Halaman 1</span>
                    <button class="page-btn" id="nextBtn" onclick="changePage(1)">Selanjutnya →</button>
                </div>
            </div>
        </div>

        <!-- HISTORY VIEW -->
        <div id="history-view">
            <h2 class="section-title">🕒 Riwayat Bacaan Kamu</h2>
            <div id="historyGrid" class="grid"></div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detail-view">
            <button class="back-btn" onclick="loadHome()">← Kembali</button>
            <div class="detail-flex">
                <img id="detailCover" class="detail-cover" src="" alt="Cover">
                <div class="detail-info">
                    <h1 id="detailTitle">Memuat detail...</h1>
                    <span class="status-badge" id="detailStatus">Status: -</span>
                    
                    <button id="resumeBtn" class="resume-btn" onclick="resumeReading()">
                        🚀 Lanjut Baca: <span id="resumeChapterText">...</span>
                    </button>
                    
                    <div class="synopsis" id="detailSynopsis">Memuat sinopsis...</div>
                </div>
            </div>

            <div class="chapter-box">
                <h2 class="section-title">📖 Daftar Chapter</h2>
                <div id="chapterList" class="chapter-list">
                    <div class="loading-state"><div class="spinner"></div><br>Memuat chapter...</div>
                </div>
            </div>
        </div>

        <!-- READER VIEW -->
        <div id="reader-view">
            <div class="reader-header">
                <div class="reader-title-bar">
                    <button class="back-btn" style="margin:0;" onclick="backToDetail()">← Kembali ke Daftar Chapter</button>
                    <h3 id="readerTitle" style="margin:0; font-size:16px; color:var(--text-high);"></h3>
                </div>
                <div id="readerNavTop"></div>
            </div>
            
            <div id="readerImages" class="reader-container">
                <div class="loading-state"><div class="spinner"></div><br>Menyiapkan halaman...</div>
            </div>
            
            <div id="readerNavBottom" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api';
        let currentPage = 1;
        let currentMode = 'latest'; 
        let currentQuery = '';
        
        let activeManhwa = {
            id: '',
            title: '',
            cover: '',
            lastChapterId: '',
            lastChapterTitle: '',
            chapters: []
        };

        window.onload = () => loadHome();

        function switchView(viewId) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('history-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById(viewId).style.display = 'block';
        }

        function updateNavActive(id) {
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-history').classList.remove('active');
            if(id) document.getElementById(id).classList.add('active');
        }

        function getHistory() {
            return JSON.parse(localStorage.getItem('manhwa_history') || '{}');
        }

        function saveHistory(manhwaId, title, cover, chapterId, chapterTitle) {
            let history = getHistory();
            history[manhwaId] = {
                id: manhwaId,
                title: title,
                cover: cover,
                lastChapterId: chapterId,
                lastChapterTitle: chapterTitle,
                timestamp: Date.now()
            };
            localStorage.setItem('manhwa_history', JSON.stringify(history));
        }

        function loadHistoryView() {
            switchView('history-view');
            updateNavActive('nav-history');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            const history = getHistory();
            const historyArray = Object.values(history).sort((a, b) => b.timestamp - a.timestamp);
            const grid = document.getElementById('historyGrid');

            if (historyArray.length === 0) {
                grid.innerHTML = '<div class="empty-state">Belum ada manhwa yang dibaca. Mulai eksplorasi sekarang!</div>';
                return;
            }

            grid.innerHTML = historyArray.map(item => `
                <div class="card" onclick="loadDetail('${item.id}')">
                    <img class="card-img" src="${item.cover}" onerror="this.src='https://via.placeholder.com/160x240?text=No+Image'" loading="lazy">
                    <div class="card-body">
                        <div class="card-title" title="${item.title}">${item.title}</div>
                        <div class="history-badge">Terakhir: ${item.lastChapterTitle}</div>
                    </div>
                </div>
            `).join('');
        }

        async function loadHome() {
            switchView('home-view');
            updateNavActive('nav-home');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('popularSection').style.display = 'block';
            document.getElementById('mainSectionTitle').innerText = '🆕 Update Terbaru';
            document.getElementById('searchInput').value = '';
            currentMode = 'latest';
            currentPage = 1;

            fetchPopular();
            fetchMainGrid();
        }

        async function fetchPopular() {
            const carousel = document.getElementById('popularCarousel');
            try {
                const res = await fetch(`${API}/manga/popular?page=1`);
                const json = await res.json();
                const list = json.data?.mangas || json.data || json.result || [];
                
                if (!list || list.length === 0) return carousel.innerHTML = '<div class="loading-state">Gagal memuat manhwa populer.</div>';
                carousel.innerHTML = list.map(m => createCardHTML(m)).join('');
            } catch (err) {
                carousel.innerHTML = `<div class="error-state">❌ Server API tidak merespons.</div>`;
            }
        }

        async function fetchMainGrid() {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '<div class="loading-state"><div class="spinner"></div><br>Memuat update...</div>';
            document.getElementById('paginationBox').style.display = 'none';

            let endpoint = currentMode === 'search' 
                ? `${API}/manga/search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`
                : `${API}/manga/latest?page=${currentPage}`;

            try {
                const res = await fetch(endpoint);
                const json = await res.json();
                const list = json.data?.mangas || json.data || json.result || [];
                
                if (!list || list.length === 0) return grid.innerHTML = '<div class="loading-state">Tidak ada manhwa ditemukan.</div>';
                
                grid.innerHTML = list.map(m => createCardHTML(m)).join('');
                document.getElementById('paginationBox').style.display = 'flex';
                document.getElementById('pageIndicator').innerText = `Halaman ${currentPage}`;
                document.getElementById('prevBtn').disabled = currentPage <= 1;
            } catch (err) {
                grid.innerHTML = `<div class="error-state">❌ Gagal mengambil data dari server.</div>`;
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            switchView('home-view');
            updateNavActive('nav-home');
            document.getElementById('popularSection').style.display = 'none'; 
            document.getElementById('mainSectionTitle').innerText = `🔍 Hasil Pencarian: "${query}"`;
            currentMode = 'search';
            currentQuery = query;
            currentPage = 1;
            fetchMainGrid();
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            fetchMainGrid();
            document.getElementById('mainSectionTitle').scrollIntoView({ behavior: 'smooth' });
        }

        function createCardHTML(m) {
            const manhwaId = m.url || m.id || '';
            const title = m.title || 'Tanpa Judul';
            const cover = m.thumbnail || m.cover || '';
            return `
                <div class="card" onclick="loadDetail('${manhwaId}')">
                    <img class="card-img" src="${cover}" onerror="this.src='https://via.placeholder.com/160x240?text=No+Image'" loading="lazy">
                    <div class="card-body">
                        <div class="card-title" title="${title}">${title}</div>
                    </div>
                </div>
            `;
        }

        async function loadDetail(manhwaId) {
            activeManhwa.id = manhwaId;
            switchView('detail-view');
            updateNavActive(''); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            document.getElementById('detailTitle').innerText = 'Memuat detail...';
            document.getElementById('detailSynopsis').innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div>';
            document.getElementById('chapterList').innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
            
            const resumeBtn = document.getElementById('resumeBtn');
            resumeBtn.style.display = 'none';

            try {
                const res = await fetch(`${API}/manga/${manhwaId}`);
                const jsonRes = await res.json();
                const detail = jsonRes.data || jsonRes;

                activeManhwa.title = detail.title || 'Tanpa Judul';
                activeManhwa.cover = detail.thumbnail || detail.cover || '';

                document.getElementById('detailCover').src = activeManhwa.cover;
                document.getElementById('detailTitle').innerText = activeManhwa.title;
                document.getElementById('detailSynopsis').innerText = detail.description || detail.synopsis || 'Tidak ada sinopsis.';
                document.getElementById('detailStatus').innerText = detail.status ? `Status: ${detail.status}` : 'Status: Unknown';

                const history = getHistory();
                const record = history[manhwaId];
                if (record && record.lastChapterId) {
                    activeManhwa.lastChapterId = record.lastChapterId;
                    activeManhwa.lastChapterTitle = record.lastChapterTitle;
                    document.getElementById('resumeChapterText').innerText = record.lastChapterTitle;
                    resumeBtn.style.display = 'flex';
                }

                const resCh = await fetch(`${API}/manga/${manhwaId}/chapters`);
                const chJson = await resCh.json();
                const chaptersRaw = chJson.data?.chapters || chJson.chapters || chJson.data || chJson.result || (Array.isArray(chJson) ? chJson : []);

                const chList = document.getElementById('chapterList');
                if (!chaptersRaw || chaptersRaw.length === 0) return chList.innerHTML = '<div class="error-state">Daftar chapter tidak ditemukan.</div>';

                activeManhwa.chapters = chaptersRaw.map((ch, index) => ({
                    id: ch.url || ch.id || '',
                    title: ch.title || ch.chapter || ch.name || `Chapter ${chaptersRaw.length - index}`,
                    date: ch.date || ch.releaseDate || ''
                }));

                chList.innerHTML = activeManhwa.chapters.map(ch => {
                    const isLastRead = (record && record.lastChapterId === ch.id) ? 'last-read' : '';
                    return `
                        <div class="chapter-item ${isLastRead}" id="ch-${ch.id}" onclick="loadChapterPages('${ch.id}', '${ch.title.replace(/'/g, "\\'")}')">
                            <span class="ch-title">${ch.title}</span>
                            <span class="ch-date">${ch.date}</span>
                        </div>
                    `;
                }).join('');
                
                if(record && record.lastChapterId) {
                    setTimeout(() => {
                        const targetCh = document.getElementById(`ch-${record.lastChapterId}`);
                        if(targetCh) targetCh.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                }

            } catch (err) {
                document.getElementById('chapterList').innerHTML = `<div class="error-state">❌ Gagal mengambil detail dan chapter.</div>`;
            }
        }

        function resumeReading() {
            if(activeManhwa.lastChapterId) {
                loadChapterPages(activeManhwa.lastChapterId, activeManhwa.lastChapterTitle);
            }
        }
        
        function getChapterNavHTML(currentChapterId) {
            if (!activeManhwa.chapters || activeManhwa.chapters.length === 0) return '';
            
            const currentIndex = activeManhwa.chapters.findIndex(ch => ch.id === currentChapterId);
            if (currentIndex === -1) return '';

            const nextCh = activeManhwa.chapters[currentIndex - 1]; 
            const prevCh = activeManhwa.chapters[currentIndex + 1]; 

            let html = '<div class="chapter-nav-buttons">';
            
            if (prevCh) {
                html += `<button class="nav-ch-btn" onclick="loadChapterPages('${prevCh.id}', '${prevCh.title.replace(/'/g, "\\'")}')">← Sebelumnya</button>`;
            } else {
                html += `<button class="nav-ch-btn" disabled>← Mentok</button>`;
            }

            if (nextCh) {
                html += `<button class="nav-ch-btn" onclick="loadChapterPages('${nextCh.id}', '${nextCh.title.replace(/'/g, "\\'")}')">Selanjutnya →</button>`;
            } else {
                html += `<button class="nav-ch-btn" disabled>Mentok →</button>`;
            }
            
            html += '</div>';
            return html;
        }

        async function loadChapterPages(chapterId, chapterTitle) {
            switchView('reader-view');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            saveHistory(activeManhwa.id, activeManhwa.title, activeManhwa.cover, chapterId, chapterTitle);
            
            document.getElementById('readerTitle').innerText = `${activeManhwa.title} - ${chapterTitle}`;
            
            const navHtml = getChapterNavHTML(chapterId);
            document.getElementById('readerNavTop').innerHTML = navHtml;
            document.getElementById('readerNavBottom').innerHTML = navHtml;

            const container = document.getElementById('readerImages');
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><br>Menyiapkan halaman...</div>';

            try {
                const res = await fetch(`${API}/manga/chapter/${chapterId}/pages`);
                const json = await res.json();
                const pages = json.data?.pages || json.pages || json.result || json.data || (Array.isArray(json) ? json : []);

                if (!pages || pages.length === 0) return container.innerHTML = '<div class="error-state">Gambar halaman tidak ditemukan.</div>';

                container.innerHTML = pages.map(p => {
                    const rawUrl = p.imageUrl || p.url || p.image || p;
                    const finalImgUrl = `${API}/manga/image?url=${encodeURIComponent(rawUrl)}`;
                    return `<img src="${finalImgUrl}" loading="lazy" onerror="this.src='${rawUrl}'">`;
                }).join('');
            } catch (err) {
                container.innerHTML = `<div class="error-state">❌ Gagal memuat halaman manhwa.</div>`;
            }
        }

        function backToDetail() {
            if (activeManhwa.id) loadDetail(activeManhwa.id);
            else loadHome();
        }
    </script>
</body>
</html>
