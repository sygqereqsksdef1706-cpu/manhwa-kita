<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANHWA-KITA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 onclick="goHome()" class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 flex items-center gap-2 cursor-pointer">
                ⚡ MANHWA <span class="text-white font-light">-KITA</span>
            </h1>
            <nav class="flex items-center gap-6 text-sm font-medium">
                <button onclick="goHome()" class="text-amber-400 hover:text-amber-300 transition flex items-center gap-1.5">🏠 Beranda</button>
                <button onclick="showHistory()" class="text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5">🕒 Riwayat Baca</button>
            </nav>
            <div class="w-full sm:w-80 flex gap-2">
                <input type="text" id="searchInput" placeholder="Cari manhwa..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:border-amber-400 text-slate-200 placeholder-slate-500" onkeypress="if(event.key==='Enter') searchMangaAction()">
                <button onclick="searchMangaAction()" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 text-slate-950 font-bold px-5 py-2 rounded-xl text-sm transition shadow-lg">Cari</button>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- VIEW 1: BERANDA -->
        <div id="homeView" class="space-y-8">
            <div id="popularSectionWrapper">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base sm:text-lg font-bold text-amber-400 flex items-center gap-2">🔥 Manhwa Terpopuler</h2>
                </div>
                <div id="popularContainer" class="flex gap-3 overflow-x-auto no-scrollbar pb-3 pt-1 snap-x">
                    <div class="w-full text-center py-6 text-slate-500 text-xs animate-pulse">Memuat data terpopuler...</div>
                </div>
            </div>

            <div>
                <h2 id="mainSectionTitle" class="text-base sm:text-lg font-bold text-cyan-400 mb-3 flex items-center gap-2">🆕 Update Terbaru</h2>
                <div id="latestContainer" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4">
                    <div class="col-span-full text-center py-10 text-slate-500 text-sm animate-pulse">Memuat data...</div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: DETAIL MANHWA -->
        <div id="detailView" class="hidden space-y-6">
            <button onclick="goHome()" class="text-sm text-amber-400 hover:underline flex items-center gap-1 font-semibold">&larr; Kembali ke Beranda</button>
            <div id="detailContent" class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-900/60 border border-slate-800/80 p-5 sm:p-6 rounded-2xl shadow-xl">
                <!-- Diisi via JS -->
            </div>
        </div>

        <!-- VIEW 3: BACA CHAPTER -->
        <div id="readerView" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-slate-900/90 px-4 py-2.5 rounded-xl border border-slate-800/60 backdrop-blur text-xs">
                <button onclick="backToDetail()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-medium transition text-slate-300">&larr; Menu Chapter</button>
                <span id="readerTitle" class="font-bold text-amber-400 truncate max-w-[180px] sm:max-w-md">Chapter ...</span>
            </div>

            <div id="pagesContainer" class="flex flex-col items-center justify-center max-w-3xl mx-auto bg-black rounded-xl overflow-hidden min-h-[60vh]">
                <div class="text-center py-20 text-slate-500 animate-pulse">Memuat halaman gambar...</div>
            </div>

            <!-- Navigasi Bawah (Diperbaiki: Sebelumnya = chapter lama, Selanjutnya = chapter baru) -->
            <div class="flex items-center justify-between bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 max-w-3xl mx-auto">
                <button id="prevBtn" onclick="changeChapter(-1)" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 px-3.5 py-2 rounded-lg text-xs font-bold transition disabled:opacity-30">← Sebelumnya</button>
                <span id="readerChapterInfo" class="text-xs text-slate-400 font-medium">Navigasi</span>
                <button id="nextBtn" onclick="changeChapter(1)" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 px-3.5 py-2 rounded-lg text-xs font-bold transition disabled:opacity-30">Selanjutnya →</button>
            </div>
        </div>

        <!-- VIEW 4: RIWAYAT BACA -->
        <div id="historyView" class="hidden space-y-6">
            <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">🕒 Riwayat Baca Terakhir</h2>
            <div id="historyContainer" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4">
                <div class="col-span-full text-center py-10 text-slate-500 text-sm">Belum ada riwayat baca.</div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logika Aplikasi -->
    <script>
        let currentMangaId = null;
        let currentChaptersList = [];
        let currentChapterIndex = 0;

        function switchView(viewName) {
            ['homeView', 'detailView', 'readerView', 'historyView'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById(viewName).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function goHome() {
            switchView('homeView');
            document.getElementById('popularSectionWrapper').style.display = 'block';
            document.getElementById('mainSectionTitle').innerText = '🆕 Update Terbaru';
            document.getElementById('searchInput').value = '';
            loadPopularManga();
            loadLatestManga();
        }

        async function loadPopularManga() {
            try {
                const res = await fetch('/api/manga/popular?page=1');
                const json = await res.json();
                const list = json.data?.mangas || [];
                const container = document.getElementById('popularContainer');
                container.innerHTML = '';
                if(list.length === 0) { container.innerHTML = '<p class="text-xs text-slate-500">Tidak ada data.</p>'; return; }
                list.forEach(m => { container.innerHTML += createCard(m, true); });
            } catch (e) { console.error(e); }
        }

        async function loadLatestManga() {
            try {
                const res = await fetch('/api/manga/latest?page=1');
                const json = await res.json();
                const list = json.data?.mangas || [];
                const container = document.getElementById('latestContainer');
                container.innerHTML = '';
                if(list.length === 0) { container.innerHTML = '<p class="col-span-full text-sm text-slate-500">Tidak ada data.</p>'; return; }
                list.forEach(m => { container.innerHTML += createCard(m, false); });
            } catch (e) { console.error(e); }
        }

        function createCard(manga, isPopular = false) {
            const id = manga.url; 
            const widthClass = isPopular ? 'min-w-[130px] sm:min-w-[150px] w-[130px] sm:w-[150px]' : 'w-full';
            return `
                <div onclick="loadDetail('${id}')" class="${widthClass} bg-slate-900/80 border border-slate-800/80 rounded-xl overflow-hidden hover:border-amber-500/50 hover:shadow-lg transition-all duration-300 flex flex-col snap-start group cursor-pointer">
                    <div class="aspect-[3/4] bg-slate-800 relative overflow-hidden">
                        <img src="${manga.thumbnail || ''}" alt="${manga.title}" class="object-cover w-full h-full group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                    </div>
                    <div class="p-2 flex flex-col flex-grow justify-between">
                        <h3 class="text-xs font-semibold line-clamp-2 text-slate-200 group-hover:text-amber-400 transition">${manga.title}</h3>
                    </div>
                </div>
            `;
        }

        async function searchMangaAction() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return alert('Masukkan judul manga yang ingin dicari!');
            
            switchView('homeView');
            document.getElementById('popularSectionWrapper').style.display = 'none';
            document.getElementById('mainSectionTitle').innerText = `🔍 Hasil Pencarian: "${query}"`;
            
            const container = document.getElementById('latestContainer');
            container.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500 animate-pulse">Mencari manga...</div>';

            try {
                const res = await fetch(`/api/manga/search?q=${encodeURIComponent(query)}&page=1`);
                const json = await res.json();
                const list = json.data?.mangas || json.data || [];
                
                container.innerHTML = '';
                if(list.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-red-400 py-10">Manga tidak ditemukan.</p>';
                    return;
                }
                list.forEach(m => { container.innerHTML += createCard(m, false); });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="col-span-full text-center text-red-400 py-10">Gagal melakukan pencarian.</p>';
            }
        }

        async function loadDetail(mangaId) {
            currentMangaId = mangaId;
            switchView('detailView');
            const container = document.getElementById('detailContent');
            container.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500 animate-pulse">Memuat detail manga & daftar chapter...</div>';

            try {
                const res = await fetch(`/api/manga/${mangaId}`);
                const json = await res.json();
                const data = json.data || json;

                const chapRes = await fetch(`/api/manga/${mangaId}/chapters`);
                const chapJson = await chapRes.json();
                let rawChapters = chapJson.data?.chapters || chapJson.chapters || chapJson.data || [];
                
                // BALIK URUTAN CHAPTER: Supaya Chapter 1 berada di paling bawah (urutan kronologis benar)
                currentChaptersList = rawChapters.reverse();

                container.innerHTML = `
                    <div class="aspect-[3/4] rounded-xl overflow-hidden bg-slate-800 shadow-2xl border border-slate-700/50">
                        <img src="${data.thumbnail || data.cover || ''}" class="w-full h-full object-cover">
                    </div>
                    <div class="md:col-span-2 space-y-4">
                        <h2 class="text-xl sm:text-2xl font-black text-amber-400">${data.title || 'Judul Manga'}</h2>
                        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed max-h-36 overflow-y-auto pr-2">${data.synopsis || data.description || 'Tidak ada sinopsis tersedia.'}</p>
                        <div class="pt-2">
                            <h3 class="text-sm font-bold text-cyan-400 mb-2 flex items-center gap-2">📖 Daftar Chapter (${currentChaptersList.length})</h3>
                            <div class="max-h-80 overflow-y-auto space-y-1.5 pr-2 border border-slate-800/80 p-2.5 rounded-xl bg-slate-950/80">
                                ${currentChaptersList.length > 0 ? currentChaptersList.map((ch, idx) => `
                                    <button onclick="loadChapterPages(${idx})" class="w-full text-left bg-slate-900/90 hover:bg-slate-800 border border-slate-800/80 px-3 py-2.5 rounded-lg text-xs sm:text-sm flex justify-between items-center transition group">
                                        <span class="font-medium text-slate-200 group-hover:text-amber-400 transition">${ch.title || ch.chapterName || 'Chapter ' + (idx+1)}</span>
                                        <span class="text-[11px] text-amber-400 font-semibold bg-amber-500/10 px-2 py-0.5 rounded">Baca &rarr;</span>
                                    </button>
                                `).join('') : '<p class="text-center text-xs text-slate-500 py-3">Chapter tidak ditemukan.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-red-400 text-center col-span-full text-sm">❌ Gagal memuat detail manga.</p>';
            }
        }

        async function loadChapterPages(index) {
            currentChapterIndex = index;
            const chapter = currentChaptersList[index];
            if (!chapter) return;
            
            const chapterId = chapter.url || chapter.chapterId || chapter.id;

            switchView('readerView');
            document.getElementById('readerTitle').innerText = chapter.title || chapter.chapterName || `Chapter ${index+1}`;
            
            // Logika tombol navigasi: Karena array sudah dibalik (Chapter 1 di index 0), 
            // Sebelumnya (index berkurang) = Chapter lama, Selanjutnya (index bertambah) = Chapter baru.
            document.getElementById('prevBtn').disabled = (index <= 0);
            document.getElementById('nextBtn').disabled = (index >= currentChaptersList.length - 1);

            const container = document.getElementById('pagesContainer');
            container.innerHTML = '<div class="text-center py-20 text-slate-500 animate-pulse text-xs">Memuat halaman gambar...</div>';

            saveToHistory({
                id: currentMangaId,
                title: document.querySelector('#detailContent h2')?.innerText || 'Manga',
                thumbnail: document.querySelector('#detailContent img')?.src || '',
                chapterTitle: chapter.title || chapter.chapterName || `Chapter ${index+1}`,
                chapterIndex: index
            });

            try {
                const res = await fetch(`/api/manga/chapter/${chapterId}/pages`);
                const json = await res.json();
                const pages = json.data?.pages || json.pages || json.data || json;

                container.innerHTML = '';
                if (!pages || pages.length === 0) {
                    container.innerHTML = '<p class="text-red-400 text-center py-10 text-xs">Gambar halaman tidak tersedia.</p>';
                    return;
                }

                pages.forEach(page => {
                    const pageUrl = typeof page === 'string' ? page : (page.url || page.imageUrl || page);
                    container.innerHTML += `<img src="${pageUrl}" class="w-full max-w-2xl object-contain block mx-auto mb-0.5" loading="lazy" onerror="this.src='https://via.placeholder.com/600x800?text=Gagal+Muat+Gambar'">`;
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-red-400 text-center py-10 text-xs">❌ Gagal memuat halaman chapter.</p>';
            }
        }

        function changeChapter(direction) {
            // direction -1 = Sebelumnya, direction 1 = Selanjutnya
            const newIndex = currentChapterIndex + direction;
            if (newIndex >= 0 && newIndex < currentChaptersList.length) {
                loadChapterPages(newIndex);
            }
        }

        function backToDetail() {
            switchView('detailView');
        }

        function saveToHistory(item) {
            let history = JSON.parse(localStorage.getItem('manga_history') || '[]');
            history = history.filter(h => h.id !== item.id);
            history.unshift(item);
            if (history.length > 20) history.pop();
            localStorage.setItem('manga_history', JSON.stringify(history));
        }

        function showHistory() {
            switchView('historyView');
            const history = JSON.parse(localStorage.getItem('manga_history') || '[]');
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            if (history.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-slate-500 text-sm py-10">Belum ada riwayat baca.</p>';
                return;
            }

            history.forEach(h => {
                container.innerHTML += `
                    <div onclick="loadDetail('${h.id}')" class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden hover:border-amber-500/50 cursor-pointer transition flex flex-col group">
                        <div class="aspect-[3/4] bg-slate-800 relative overflow-hidden">
                            <img src="${h.thumbnail}" class="object-cover w-full h-full group-hover:scale-105 transition duration-500">
                        </div>
                        <div class="p-2 flex flex-col flex-grow justify-between">
                            <h3 class="text-xs font-semibold line-clamp-1 text-slate-200">${h.title}</h3>
                            <span class="text-[10px] text-amber-400 mt-1 font-medium">${h.chapterTitle}</span>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = () => {
            goHome();
        };
    </script>
</body>
</html>
