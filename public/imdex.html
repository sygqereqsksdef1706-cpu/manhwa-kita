<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANHWA-KITA</title>
    <!-- Tailwind CSS CDN untuk styling cepat & rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-xl font-bold tracking-wider text-amber-400 flex items-center gap-2">
                ⚡ MANHWA <span class="text-white">-KITA</span>
            </h1>
            <nav class="flex items-center gap-4 text-sm font-medium">
                <a href="#" class="text-amber-400 hover:text-amber-300 transition">🏠 Beranda</a>
                <a href="#" class="text-slate-400 hover:text-slate-200 transition">🕒 Riwayat Baca</a>
            </nav>
            <div class="w-full sm:w-72 flex gap-2">
                <input type="text" id="searchInput" placeholder="Cari manhwa..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-amber-400 text-slate-200">
                <button onclick="searchManga()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-1.5 rounded-lg text-sm transition">Cari</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 space-y-8">
        
        <!-- Section: Manhwa Terpopuler -->
        <section>
            <h2 class="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                🔥 Manhwa Terpopuler
            </h2>
            <div id="popularContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Loading State -->
                <div class="col-span-full text-center py-8 text-slate-400 text-sm animate-pulse">
                    Memuat data manhwa terpopuler...
                </div>
            </div>
        </section>

        <!-- Section: Update Terbaru -->
        <section>
            <h2 class="text-lg font-bold text-cyan-400 mb-4 flex items-center gap-2">
                🆕 Update Terbaru
            </h2>
            <div id="latestContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Loading State -->
                <div class="col-span-full text-center py-8 text-slate-400 text-sm animate-pulse">
                    Memuat update terbaru...
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Fetch API -->
    <script>
        // Fungsi Ambil Data Populer
        async function loadPopularManga() {
            try {
                const response = await fetch('/api/manga/popular?page=1');
                const result = await response.json();
                
                const container = document.getElementById('popularContainer');
                container.innerHTML = '';

                // Sesuaikan struktur data (asumsi data manga ada di result.data atau result.results)
                const mangaList = result.data || result.results || result;

                if (!mangaList || mangaList.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-red-400 text-sm">Tidak ada data populer ditemukan.</p>';
                    return;
                }

                mangaList.forEach(manga => {
                    const card = `
                        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden hover:border-slate-700 transition flex flex-col">
                            <div class="aspect-[3/4] bg-slate-800 relative overflow-hidden">
                                <img src="${manga.thumbnail || manga.image || ''}" alt="${manga.title}" class="object-cover w-full h-full" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                            </div>
                            <div class="p-3 flex flex-col flex-grow justify-between">
                                <h3 class="text-sm font-semibold line-clamp-2 text-slate-200 mb-1">${manga.title}</h3>
                                <span class="text-xs text-slate-400">${manga.latestChapter || manga.chapter || ''}</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (err) {
                console.error("Gagal memuat popular:", err);
                document.getElementById('popularContainer').innerHTML = '<p class="col-span-full text-center text-red-400 text-sm">❌ Gagal mengambil data dari server.</p>';
            }
        }

        // Fungsi Ambil Data Update Terbaru
        async function loadLatestManga() {
            try {
                const response = await fetch('/api/manga/latest?page=1');
                const result = await response.json();
                
                const container = document.getElementById('latestContainer');
                container.innerHTML = '';

                const mangaList = result.data || result.results || result;

                if (!mangaList || mangaList.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-red-400 text-sm">Tidak ada update terbaru.</p>';
                    return;
                }

                mangaList.forEach(manga => {
                    const card = `
                        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden hover:border-slate-700 transition flex flex-col">
                            <div class="aspect-[3/4] bg-slate-800 relative overflow-hidden">
                                <img src="${manga.thumbnail || manga.image || ''}" alt="${manga.title}" class="object-cover w-full h-full" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                            </div>
                            <div class="p-3 flex flex-col flex-grow justify-between">
                                <h3 class="text-sm font-semibold line-clamp-2 text-slate-200 mb-1">${manga.title}</h3>
                                <span class="text-xs text-cyan-400 font-medium">${manga.latestChapter || manga.chapter || ''}</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (err) {
                console.error("Gagal memuat latest:", err);
                document.getElementById('latestContainer').innerHTML = '<p class="col-span-full text-center text-red-400 text-sm">❌ Gagal mengambil data dari server.</p>';
            }
        }

        // Fungsi Tombol Cari
        function searchManga() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return alert('Masukkan judul manhwa yang ingin dicari!');
            window.location.href = `/api/manga/search?q=${encodeURIComponent(query)}&page=1`;
        }

        // Jalankan saat halaman dibuka
        window.onload = () => {
            loadPopularManga();
            loadLatestManga();
        };
    </script>
</body>
</html>
